# Gate 1 — every pull request.
#
# Nothing merges to main without lint, unit tests, the coverage threshold and
# a clean Terraform validation for all three environments. Enable these as
# required status checks in branch protection (see README) and the gate becomes
# enforcement rather than advice.

name: PR Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  app-quality:
    name: Lint, unit tests and coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Lint
        working-directory: app
        run: npm run lint

      - name: Unit tests
        working-directory: app
        run: npm run test:unit

      # The coverage gate runs over the whole suite. Jest exits non-zero when
      # any threshold in jest.config.js is missed, which fails this job even if
      # every individual test passed.
      - name: Coverage gate (fails below the configured thresholds)
        working-directory: app
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: app/coverage/
          retention-days: 7
          if-no-files-found: ignore

  terraform-checks:
    name: Terraform fmt and validate (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, uat, prod]
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      # No credentials are configured and none are needed: this initialises
      # without a backend and never runs plan or apply.
      - name: Validate ${{ matrix.environment }}
        run: ./scripts/validate-terraform.sh ${{ matrix.environment }}

  pr-gate:
    name: PR gate
    runs-on: ubuntu-latest
    needs: [app-quality, terraform-checks]
    steps:
      - name: All required checks passed
        run: echo "Lint, unit tests, coverage threshold and Terraform validation all passed."
